[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-ml-analytics-platform"
version = "0.9.9.5"
description = "PML Finance Project - Machine Learning for Financial Analysis"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.15"
authors = [
    { name = "Finance ML Team" }
]
keywords = ["finance", "machine-learning", "analytics", "trading", "portfolio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    # --- Numerical Computing & Data Structures ---
    # numpy 2.5.x is blocked: numba (0.65.1 and 0.66.0) requires numpy<2.5,
    # and numba is the default PyTensor backend for this project.
    "numpy>=2.1.0,<3.0.0",
    "cython>=3.0.0",
    "pandas>=2.2.0,<4.0.0",
    "scipy>=1.16.0,<4.0.0",
    "statsmodels>=0.14.0,<3.0.0",
    # --- Database Connectivity ---
    "SQLAlchemy>=2.0.30,<3.0.0",
    # --- Machine Learning: Core Frameworks ---
    "scikit-learn>=1.7.0,<4.0.0",
    "imbalanced-learn>=0.14.0,<1.0.0",
    # --- Machine Learning: Gradient Boosting ---
    "xgboost>=3.0.0,<4.0.0",
    "lightgbm>=4.6.0,<5.0.0",
    # catboost 1.2.10+ (Feb 2026) ships cp314 wheels (Windows / manylinux
    # x86_64 / manylinux aarch64), so the Python-version gate is no longer
    # required. See https://github.com/catboost/catboost/issues/2943.
    "catboost>=1.2.10,<4.0.0",
    # --- Model Interpretability (shap 0.50.0+ supports Python 3.14) ---
    "shap>=0.52.0,<1.0.0",
    # --- Data Visualization ---
    "matplotlib>=3.10.0,<4.0.0",
    "seaborn>=0.13.0,<1.0.0",
    "plotly>=6.0.0,<7.0.0",
    # kaleido v1: static Plotly PNG export (needs a Chromium;
    # `plotly_get_chrome -y` installs one when no system Chrome exists).
    "kaleido>=1.0.0,<2.0.0",
    # NetCDF engine for the Kalman-workflow DataTree artifact exports.
    "h5netcdf>=1.4.0,<2.0.0",
    # --- Utilities & Performance ---
    "tqdm>=4.67.0,<5.0.0",
    "joblib>=1.5.0,<4.0.0",
    "xlsxwriter>=3.2.0,<4.0.0",
    "psutil>=7.0.0,<8.0.0",
    "PyYAML>=6.0.0,<7.0.0",
    # --- Bayesian / Probabilistic stack (PyMC 6.0 ecosystem) ---
    # See https://www.pymc.io/blog/pymc_v6_ecosystem_updates.html for the
    # full migration notes. PyMC 6.0 requires PyTensor >=3.0,<4.0 and
    # ArviZ >=1.0 (the new modular arviz-base / arviz-stats / arviz-plots
    # split, exposed through the top-level ``arviz`` 1.x meta-package).
    # Bambi 0.16+ depends on PyMC >=6.0. nutpie 0.14+ pairs with PyMC 6.0
    # and is now PyMC's default sampler when numba (the new default
    # PyTensor backend) is available.
    # pymc 6.2 <-> pytensor 3.2 are mutually required (pymc 6.1 caps
    # pytensor<3.2, pymc 6.2 requires pytensor>=3.2.2,<3.3) — bump together.
    "pymc>=6.2.0,<7.0.0",
    "pytensor>=3.2.2,<4.0.0",
    "arviz>=1.1.0,<2.0.0",
    "arviz-base>=1.1.0,<2.0.0",
    "arviz-stats>=1.1.0,<2.0.0",
    "arviz-plots>=1.1.0,<2.0.0",
    "bambi>=0.19.0,<1.0.0",
    "nutpie>=0.16.0,<1.0.0",
    "xarray>=2026.1.0,<2027.0.0",
    "jax>=0.11.0,<1.0.0",
    "jaxlib>=0.11.0,<1.0.0",
    "numpyro>=0.18.0,<1.0.0",
    "blackjax>=1.6.0,<2.0.0",
    # --- Hyperparameter Optimization ---
    "optuna>=4.5.0,<5.0.0",
    # --- Networking ---
    "requests>=2.32.0",
]

[project.optional-dependencies]
# Testing, linting, and code formatting tools
dev = [
    "pytest>=9.0.0,<12.0.0",
    "pytest-cov>=7.0.0,<20.0.0",
    "black>=26.0.0,<30.0.0",
    "flake8>=7.3.0,<19.0.0",
    "mypy>=1.20.0,<1.30.0",
    "isort>=8.0.0,<11.0.0",
    "pip-tools>=7.5.0,<30.0.0",
]

# Interactive web dashboards (Python <3.14 for Streamlit)
dashboards = [
    "streamlit>=1.40.0,<6.0.0; python_version < '3.14'",
    "dash>=4.0.0,<7.0.0",
    "dash-bootstrap-components>=2.0.0,<4.0.0",
    "flask>=3.1.0,<4.0.0",
]

# Database connectivity
database = [
    "psycopg2-binary>=2.9.9,<3.0.0",
]

# Deep learning (Python <3.14 only)
tensorflow = [
    "tensorflow>=2.15.0,<3.0.0; python_version < '3.14'",
    "scikeras>=0.13.0,<1.0.0; python_version < '3.14'",
]

# Performance optimizations (numba 0.65.0+ supports Python 3.14).
# pytensor 3.2.4 raised its numba cap to <=0.66.0 (was <=0.65.1), unblocking
# numba 0.66 + llvmlite 0.48. numpy must stay <2.5 (numba 0.66 requirement).
performance = [
    "numba>=0.65.0,<1.0.0",
]

# Jupyter notebook support
notebooks = [
    "jupyter>=1.0.0,<4.0.0",
    "notebook>=7.2.0,<8.0.0",
    "ipykernel>=6.29.0,<8.0.0",
    # Required so tqdm.auto finds IProgress under Jupyter (silences TqdmWarning).
    "ipywidgets>=8.1.0,<9.0.0",
    "ipython>=8.28.0,<11.0.0",
]

# Additional utilities (used in feature_factory, dashboards, etc.)
extras = [
    "openpyxl>=3.1.0,<4.0.0",
    "boruta>=0.3.0,<1.0.0",
    "networkx>=3.3.0,<4.0.0",
    "Pillow>=12.0.0,<15.0.0",
    "forex-python>=1.8,<4.0.0",
    "python-dotenv",
]

[project.scripts]
finance-ml = "cli:main"
finance-ml-analyze = "cli:analyze"
finance-ml-validate = "cli:validate"
finance-ml-v4 = "expected_returns_v4:main"

[project.urls]
Homepage = "https://github.com/finance-ml/analytics-platform"
Documentation = "https://github.com/finance-ml/analytics-platform#readme"
Repository = "https://github.com/finance-ml/analytics-platform"

[tool.setuptools.packages.find]
where = ["."]
include = ["probabilistic_ml_model*"]

[tool.black]
line-length = 100
target-version = ["py314"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]